name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      - name: Run tests
        run: |
          pytest -q

  # Editable installs (-e) never exercise wheel packaging, so a broken wheel
  # can pass tests and still fail every real `pip install` from source.
  # This job builds the actual wheel and installs it into a clean venv.
  wheel-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel has no duplicate entries and ships data files
        run: |
          python - <<'PY'
          import glob, zipfile, collections
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          dupes = [n for n, c in collections.Counter(names).items() if c > 1]
          assert not dupes, f"duplicate entries in wheel: {dupes}"
          assert "agent_reach/skill/SKILL.md" in names, "SKILL.md missing from wheel"
          for prefix in ("agent_reach/guides/", "agent_reach/scripts/", "agent_reach/skill/references/"):
              assert any(n.startswith(prefix) for n in names), f"{prefix} missing from wheel"
          print(f"wheel OK: {len(names)} entries, no duplicates, data files present")
          PY

      - name: Smoke-install wheel into clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/agent-reach version
          cd /tmp && /tmp/smoke/bin/python -c "import agent_reach; from importlib.resources import files; assert (files('agent_reach')/'skill'/'SKILL.md').is_file(); print('SKILL.md ships in site-packages OK')"

  # Report-only by design. CONTRIBUTING.md asks contributors to run ruff and
  # mypy, and pyproject.toml configures both and ships them in [dev], but no
  # workflow has ever enforced them. These jobs make the real state visible
  # without turning the fork red. They are not gates: every remaining finding
  # lives in upstream-authored source, and this fork does not edit upstream
  # source. Promote them to gates only in a repository that owns the code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      # Annotates the diff in the GitHub UI. Never fails the build.
      - name: Run ruff (report-only)
        continue-on-error: true
        run: ruff check . --output-format=github

      # `ruff format --check` is deliberately NOT run: upstream does not format
      # with ruff, so it would report ~49 files on an unmodified snapshot and
      # drown the signal from `ruff check`.
      - name: Summarize ruff findings
        if: always()
        run: |
          {
            echo "## ruff check (report-only)"
            echo
            echo '```'
            ruff check . --output-format=concise 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      - name: Run mypy (report-only)
        continue-on-error: true
        run: mypy agent_reach

      - name: Summarize mypy findings
        if: always()
        run: |
          {
            echo "## mypy (report-only)"
            echo
            echo '```'
            mypy agent_reach 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
